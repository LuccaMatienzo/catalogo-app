apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-frontend
  namespace: catalogo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogo-frontend
  template:
    metadata:
      labels:
        app: catalogo-frontend
    spec:
      containers:
        - name: catalogo-frontend
          image: luccamatienzo/catalogo-frontend:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalogo-frontend-config
